spring.application.name=api-gateway
server.port=8082

# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[1].id=notification-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notifications/**

# Circuit Breaker for Notification Service
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=notificationCircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/notifications

# Resilience4j
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2

resilience4j.timelimiter.instances.notificationCircuitBreaker.timeoutDuration=3s

# Forwarded headers
spring.cloud.gateway.server.webflux.trusted-proxies=127\.0\.0\.1|172\.18\.0\.[0-9]+

# Spring Cloud Config Client
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}