services:
  user-postgres:
    image: postgres:17
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service_user
      POSTGRES_PASSWORD: admin123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user_service_user -d user_service" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service-app
    depends_on:
      discovery-server:
        condition: service_started
      user-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/user_service
      SPRING_DATASOURCE_USERNAME: user_service_user
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs

  notification-postgres:
    image: postgres:17
    container_name: notification-service-postgres
    environment:
      POSTGRES_DB: notification_service
      POSTGRES_USER: notification_service_user
      POSTGRES_PASSWORD: admin123
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notification_service_user -d notification_service" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
      
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service-app
    depends_on:
      discovery-server:
        condition: service_started
      notification-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      mailpit:
        condition: service_started
      config-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://notification-postgres:5432/notification_service
      DB_USERNAME: notification_service_user
      DB_PASSWORD: admin123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      MAIL_FROM: noreply@example.com
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: notification-service
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "127.0.0.1:8081:8081"

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka-broker
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "127.0.0.1:8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "127.0.0.1:8082:8082"

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/app/config-repo/
    volumes:
      - ./config-repo:/app/config-repo:ro
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  user_postgres_data:
  notification_postgres_data:
  kafka_data: